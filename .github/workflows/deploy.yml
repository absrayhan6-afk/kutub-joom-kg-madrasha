name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Grade and fee calculation tests
        run: node tests/calc.test.js && node tests/translit.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase setup
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ] || grep -q "REPLACE-WITH" .firebaserc; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase is not connected yet (secret FIREBASE_SERVICE_ACCOUNT or .firebaserc project missing). Skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Firebase Hosting
        if: steps.check.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
